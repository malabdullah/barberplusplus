name: CI
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:production-image
      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: barber-production:local-check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
      - name: Export only the local browser key
        run: node ops/release/export-local-browser-env.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:qa
      - if: always()
        run: npm run local:stop
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
      - run: npm run check:migrations
      - run: npx supabase test db
      - run: npm run check:schema
      - name: Verify local backend across service boundaries
        run: node scripts/probe-local-backend.mjs
      - name: Verify persistence and explicit synthetic reset
        run: node scripts/verify-local-lifecycle.mjs
      - if: always()
        run: npm run local:stop
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

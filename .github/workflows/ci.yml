name: CI
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      reviewed_validation:
        type: string
        default: 'off'
permissions:
  contents: read
jobs:
  reviewed-inputs:
    if: inputs.reviewed_validation == 'verified-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-reviewed-inputs.yml
    permissions: { contents: read, actions: read, pull-requests: read }
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the required domain scanner
        run: |
          sudo python3 .github/scripts/prepare-ubuntu-apt.py
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:production-image
      - name: Compile Functions on the exact production Linux runtime
        run: python3 ops/release/test-functions-image.py
      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: barber-production:local-check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  browser:
    needs: reviewed-inputs
    if: ${{ !cancelled() && needs.reviewed-inputs.outputs.browser != 'true' }}
    name: ${{ matrix.slot == 1 && 'browser' || format('browser (runner {0})', matrix.slot) }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.slot != 1 }}
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[1,2,3,4,5,6,7,8]' || '[1]') }}
    env:
      VERIFIED_RUNNER_SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Check exact Test runner
        id: pin
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python3 .github/scripts/verified_ci.py admit browser
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
      - name: Export only the local browser key
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
        run: node ops/release/export-local-browser-env.mjs
      - name: Prepare reliable browser dependency downloads
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
        run: sudo python3 .github/scripts/prepare-ubuntu-apt.py
      - run: npx playwright install --with-deps chromium firefox webkit
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
      - name: Verify scoped Apple popup transport without provider calls
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
        run: node scripts/check-apple-popup-policy.mjs
      - name: Sample inputs for reviewed pre-merge validation
        if: steps.pin.outputs.admitted == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/scripts/verified_ci.py sample browser
      - name: Check whether the reviewed browser result is reusable
        id: reuse
        if: steps.pin.outputs.admitted == 'true' && inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BARBER_VALIDATION_MODE: ${{ inputs.reviewed_validation }}
        run: python3 .github/scripts/verified_ci.py reuse browser
      - run: npm run test:e2e
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
      - run: npm run test:e2e:qa
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
      - name: Record unchanged browser inputs after tests
        id: recorded
        if: steps.pin.outputs.admitted == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/scripts/verified_ci.py record browser
      - name: Upload immutable browser input receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.recorded.outputs.recorded == 'true'
        continue-on-error: true
        with:
          name: release-inputs-browser-${{ github.run_attempt }}-${{ matrix.slot }}-${{ steps.recorded.outputs.fingerprint }}
          path: ${{ runner.temp }}/release-inputs.json
          retention-days: 1
          if-no-files-found: error
      - name: Report bounded synthetic setup diagnostics
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='.local-test/last-error.log';
          const log=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
          const unique=items=>[...new Set(items)].slice(-15);
          console.log(JSON.stringify({
            sqlStates:unique([...log.matchAll(/SQLSTATE ([A-Z0-9]{5})/g)].map(m=>m[1])),
            migrations:unique([...log.matchAll(/Applying migration ([0-9]{14}_[a-z0-9_]+\.sql)/g)].map(m=>m[1])),
            phoneErrors:unique([...log.matchAll(/\b(?:PHONE_IN_USE|INVALID_PHONE|INVALID_BARBER_ACCOUNT)\b/g)].map(m=>m[0])),
            objects:unique([...log.matchAll(/(?:column|relation|schema|table|constraint|function) "([a-z_][a-z0-9_]{0,80})"/g)].map(m=>m[1]))
          }));
          JS
      - if: always() && (matrix.slot == 1 || steps.pin.outputs.admitted == 'true')
        run: npm run local:stop
      - name: Publish completed pinned shadow evidence
        if: steps.reuse.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-shadow-browser-${{ matrix.slot }}
          path: ${{ runner.temp }}/pinned-shadow.json
          retention-days: 1
          if-no-files-found: error
  database:
    needs: reviewed-inputs
    if: ${{ !cancelled() && needs.reviewed-inputs.outputs.database != 'true' }}
    name: ${{ matrix.slot == 1 && 'database' || format('database (runner {0})', matrix.slot) }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.slot != 1 }}
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[1,2,3,4,5,6,7,8]' || '[1]') }}
    env:
      VERIFIED_RUNNER_SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Check exact Test runner
        id: pin
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python3 .github/scripts/verified_ci.py admit database
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
      - run: npm run check:migrations
        if: matrix.slot == 1 || steps.pin.outputs.admitted == 'true'
      - name: Sample inputs for reviewed pre-merge validation
        if: steps.pin.outputs.admitted == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/scripts/verified_ci.py sample database
      - name: Check whether the reviewed database result is reusable
        id: reuse
        if: steps.pin.outputs.admitted == 'true' && inputs.reviewed_validation == 'shadow-v1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BARBER_VALIDATION_MODE: ${{ inputs.reviewed_validation }}
        run: python3 .github/scripts/verified_ci.py reuse database
      - run: npx supabase test db
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
      - run: npm run check:schema
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
      - name: Retain synthetic schema diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-schema-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: |
            .local-test/schema.actual.sql
            .local-test/schema.diff
          if-no-files-found: ignore
          retention-days: 1
      - name: Replay on the exact production PostgreSQL image
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: python3 ops/release/test-postgres-image.py
      - name: Rehearse deletion with pinned Auth and Storage
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: python3 ops/account-deletion/rehearse-platform.py
      - name: Verify local backend across service boundaries
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: node scripts/probe-local-backend.mjs
      - name: Verify synthetic invitations and local email
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: node scripts/probe-local-invitations.mjs
      - name: Verify customer email, social profiles and booking ownership
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: |
          node scripts/probe-customer-email.mjs
          node scripts/probe-customer-social.mjs
          node scripts/probe-customer-smtp.mjs
      - name: Verify persistence and explicit synthetic reset
        if: (matrix.slot == 1 || steps.pin.outputs.admitted == 'true') && steps.reuse.outputs.reused != 'true'
        run: node scripts/verify-local-lifecycle.mjs
      - name: Record unchanged database inputs after tests
        id: recorded
        if: steps.pin.outputs.admitted == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/scripts/verified_ci.py record database
      - name: Upload immutable database input receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.recorded.outputs.recorded == 'true'
        continue-on-error: true
        with:
          name: release-inputs-database-${{ github.run_attempt }}-${{ matrix.slot }}-${{ steps.recorded.outputs.fingerprint }}
          path: ${{ runner.temp }}/release-inputs.json
          retention-days: 1
          if-no-files-found: error
      - name: Report bounded synthetic setup diagnostics
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='.local-test/last-error.log';
          const log=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
          const unique=items=>[...new Set(items)].slice(-15);
          console.log(JSON.stringify({
            sqlStates:unique([...log.matchAll(/SQLSTATE ([A-Z0-9]{5})/g)].map(m=>m[1])),
            migrations:unique([...log.matchAll(/Applying migration ([0-9]{14}_[a-z0-9_]+\.sql)/g)].map(m=>m[1])),
            phoneErrors:unique([...log.matchAll(/\b(?:PHONE_IN_USE|INVALID_PHONE|INVALID_BARBER_ACCOUNT)\b/g)].map(m=>m[0])),
            objects:unique([...log.matchAll(/(?:column|relation|schema|table|constraint|function) "([a-z_][a-z0-9_]{0,80})"/g)].map(m=>m[1]))
          }));
          JS
      - if: always() && (matrix.slot == 1 || steps.pin.outputs.admitted == 'true')
        run: npm run local:stop
      - name: Publish completed pinned shadow evidence
        if: steps.reuse.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-shadow-database-${{ matrix.slot }}
          path: ${{ runner.temp }}/pinned-shadow.json
          retention-days: 1
          if-no-files-found: error
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

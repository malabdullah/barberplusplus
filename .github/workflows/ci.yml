name: CI
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the required domain scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:production-image
      - name: Compile Functions on the exact production Linux runtime
        run: python3 ops/release/test-functions-image.py
      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: barber-production:local-check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
      - name: Export only the local browser key
        run: node ops/release/export-local-browser-env.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:qa
      - name: Report bounded synthetic setup diagnostics
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='.local-test/last-error.log';
          const log=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
          const unique=items=>[...new Set(items)].slice(-15);
          console.log(JSON.stringify({
            sqlStates:unique([...log.matchAll(/SQLSTATE ([A-Z0-9]{5})/g)].map(m=>m[1])),
            migrations:unique([...log.matchAll(/Applying migration ([0-9]{14}_[a-z0-9_]+\.sql)/g)].map(m=>m[1])),
            phoneErrors:unique([...log.matchAll(/\b(?:PHONE_IN_USE|INVALID_PHONE|INVALID_BARBER_ACCOUNT)\b/g)].map(m=>m[0])),
            objects:unique([...log.matchAll(/(?:column|relation|schema|table|constraint|function) "([a-z_][a-z0-9_]{0,80})"/g)].map(m=>m[1]))
          }));
          JS
      - if: always()
        run: npm run local:stop
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm run local:setup
      - run: npm run check:migrations
      - run: npx supabase test db
      - run: npm run check:schema
      - name: Replay on the exact production PostgreSQL image
        run: python3 ops/release/test-postgres-image.py
      - name: Verify local backend across service boundaries
        run: node scripts/probe-local-backend.mjs
      - name: Verify synthetic invitations and local email
        run: node scripts/probe-local-invitations.mjs
      - name: Verify customer email, social profiles and booking ownership
        run: |
          node scripts/probe-customer-email.mjs
          node scripts/probe-customer-social.mjs
          node scripts/probe-customer-smtp.mjs
      - name: Verify persistence and explicit synthetic reset
        run: node scripts/verify-local-lifecycle.mjs
      - name: Report bounded synthetic setup diagnostics
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='.local-test/last-error.log';
          const log=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
          const unique=items=>[...new Set(items)].slice(-15);
          console.log(JSON.stringify({
            sqlStates:unique([...log.matchAll(/SQLSTATE ([A-Z0-9]{5})/g)].map(m=>m[1])),
            migrations:unique([...log.matchAll(/Applying migration ([0-9]{14}_[a-z0-9_]+\.sql)/g)].map(m=>m[1])),
            phoneErrors:unique([...log.matchAll(/\b(?:PHONE_IN_USE|INVALID_PHONE|INVALID_BARBER_ACCOUNT)\b/g)].map(m=>m[0])),
            objects:unique([...log.matchAll(/(?:column|relation|schema|table|constraint|function) "([a-z_][a-z0-9_]{0,80})"/g)].map(m=>m[1]))
          }));
          JS
      - if: always()
        run: npm run local:stop
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

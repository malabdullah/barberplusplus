name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require completed database baseline
        run: test -f supabase/.baseline-ready
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          build-args: APP_RELEASE=${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64, barber-staging]
    defaults:
      run:
        working-directory: release-source
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      STAGING_FUNCTION_ENV_FILE: /Users/malabdullah/actions-runner-barber-staging/.secrets/functions.env
      STAGING_FUNCTION_STATE_DIR: /Users/malabdullah/actions-runner-barber-staging/_state/functions
      STAGING_BACKUP_DIR: /Users/malabdullah/actions-runner-barber-staging/_backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: release-source/package-lock.json
      - run: npm ci
      - name: Validate isolated local staging configuration
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: npm run check:staging-preflight
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Back up isolated staging database and Storage
        env:
          BACKUP_EVIDENCE_OUTPUT: ${{ runner.temp }}/staging-backup-evidence.json
        run: sh scripts/backup-local-staging.sh
      - name: Apply isolated staging migrations
        run: |
          npx supabase db push --local --include-all --skip-vault --dry-run
          npx supabase db push --local --include-all --skip-vault --yes
      - name: Deploy staging Edge Functions locally
        run: sh scripts/deploy-local-staging-functions.sh
      - name: Deploy exact image to local Docker
        run: sh scripts/deploy-local-staging-frontend.sh
      - name: Smoke staging
        env:
          SMOKE_APP_URL: ${{ vars.APP_URL }}
          EXPECTED_ENV: staging
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: sh scripts/smoke-environment.sh
      - name: Validate staging security boundary
        env:
          STAGING_APP_URL: ${{ vars.APP_URL }}
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: npm run check:staging-boundary
      - name: Run staging browser journeys
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.APP_URL }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Record accepted release
        run: |
          node scripts/release-manifest.mjs create \
            '${{ github.event.workflow_run.head_sha }}' \
            '${{ needs.build.outputs.digest }}' \
            '${{ github.run_id }}' \
            > accepted-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-release-${{ github.event.workflow_run.head_sha }}
          path: release-source/accepted-release.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backup-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/staging-backup-evidence.json
          retention-days: 30
      - name: Mark staging acceptance complete
        id: acceptance
        run: echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: Finalize accepted staging release
        run: |
          sh scripts/finalize-local-staging-frontend.sh
          sh scripts/finalize-local-staging-functions.sh
      - name: Restore previous release after rejection
        if: failure() && steps.acceptance.outcome != 'success'
        run: |
          sh scripts/rollback-local-staging-frontend.sh
          sh scripts/rollback-local-staging-functions.sh

name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require completed database baseline
        run: test -f supabase/.baseline-ready
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Validate isolated staging configuration
        env:
          APP_URL: ${{ vars.APP_URL }}
          STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_FUNCTION_DEPLOY_HOOK: ${{ secrets.STAGING_FUNCTION_DEPLOY_HOOK }}
          STAGING_FUNCTION_DEPLOY_SECRET: ${{ secrets.STAGING_FUNCTION_DEPLOY_SECRET }}
          STAGING_BACKUP_CHECK_URL: ${{ secrets.STAGING_BACKUP_CHECK_URL }}
          STAGING_BACKUP_CHECK_TOKEN: ${{ secrets.STAGING_BACKUP_CHECK_TOKEN }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: npm run check:staging-preflight
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          build-args: APP_RELEASE=${{ github.event.workflow_run.head_sha }}
      - name: Require fresh isolated staging backup
        env:
          STAGING_BACKUP_CHECK_URL: ${{ secrets.STAGING_BACKUP_CHECK_URL }}
          STAGING_BACKUP_CHECK_TOKEN: ${{ secrets.STAGING_BACKUP_CHECK_TOKEN }}
          BACKUP_EVIDENCE_OUTPUT: ${{ runner.temp }}/staging-backup-evidence.json
        run: sh scripts/check-staging-backup.sh
      - name: Apply staging migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          npx supabase db push --db-url "$SUPABASE_DB_URL" --include-all --skip-vault --dry-run
          npx supabase db push --db-url "$SUPABASE_DB_URL" --include-all --skip-vault
      - name: Deploy staging Edge Functions
        env:
          STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_FUNCTION_DEPLOY_HOOK }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail-with-body --silent --show-error --request POST --header "x-deploy-secret:${{ secrets.STAGING_FUNCTION_DEPLOY_SECRET }}" --data "release=$DEPLOY_SHA" "$STAGING_DEPLOY_HOOK"
      - name: Deploy exact image to Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: sh scripts/dokploy-deploy.sh
      - name: Smoke staging
        env:
          SMOKE_APP_URL: ${{ vars.APP_URL }}
          EXPECTED_ENV: staging
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: sh scripts/smoke-environment.sh
      - name: Validate staging security boundary
        env:
          STAGING_APP_URL: ${{ vars.APP_URL }}
          STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: npm run check:staging-boundary
      - name: Run staging browser journeys
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.APP_URL }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record accepted release
        run: |
          node scripts/release-manifest.mjs create \
            '${{ github.event.workflow_run.head_sha }}' \
            '${{ steps.image.outputs.digest }}' \
            '${{ github.run_id }}' \
            > accepted-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-release-${{ github.event.workflow_run.head_sha }}
          path: accepted-release.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backup-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/staging-backup-evidence.json
          retention-days: 30

name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      functions_digest: ${{ steps.functions.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require completed database baseline
        run: test -f supabase/.baseline-ready
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Package committed Edge Function sources
        run: node scripts/package-staging-functions.mjs '${{ github.event.workflow_run.head_sha }}' '${{ runner.temp }}/staging-functions'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: frontend
        name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          build-args: APP_RELEASE=${{ github.event.workflow_run.head_sha }}
      - id: functions
        name: Build and publish Edge Functions image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/staging-functions
          file: ${{ github.workspace }}/ops/staging-vps/Dockerfile.functions
          push: true
          tags: ghcr.io/${{ github.repository }}-functions:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, barber-staging-vps]
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.frontend_digest }}
      FUNCTIONS_IMAGE: ghcr.io/${{ github.repository }}-functions@${{ needs.build.outputs.functions_digest }}
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_PROJECT_ID: ${{ vars.DOKPLOY_PROJECT_ID }}
      DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
      DOKPLOY_FRONTEND_APPLICATION_ID: ${{ vars.DOKPLOY_FRONTEND_APPLICATION_ID }}
      DOKPLOY_SUPABASE_COMPOSE_ID: ${{ vars.DOKPLOY_SUPABASE_COMPOSE_ID }}
      STAGING_VPS_AUTOMATION_READY: ${{ vars.STAGING_VPS_AUTOMATION_READY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate VPS deployment contract
        run: sh scripts/staging-vps-deploy-preflight.sh
      - name: Stop before an unreviewed first cutover
        run: |
          echo 'The VPS artifact path is prepared, but deployment remains fail-closed.' >&2
          echo 'Env3 backup, migration, recovery, and first-cutover contracts must be reviewed before this step is replaced.' >&2
          exit 1

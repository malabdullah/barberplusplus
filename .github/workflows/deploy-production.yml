name: Promote production

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated release tag, release record, and completed baseline
        id: release
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$release_commit" = "$(git rev-parse HEAD)"
          test -f supabase/.baseline-ready
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          grep -F 'Release preparation decision: PASS' "docs/releases/$GITHUB_REF_NAME.md" >/dev/null
          grep -F 'Migration compatibility decision: PASS' "docs/releases/$GITHUB_REF_NAME.md" >/dev/null
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the accepted staging manifest
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          runs=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?head_sha=$RELEASE_COMMIT&status=completed&per_page=100")
          run_id=$(printf '%s' "$runs" | jq -er \
            '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | reverse | .[0].id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          artifacts=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")
          artifact_url=$(printf '%s' "$artifacts" | jq -er \
            --arg name "accepted-release-$RELEASE_COMMIT" \
            '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url')
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output accepted-release.zip \
            "$artifact_url"
          unzip -q accepted-release.zip accepted-release.json
      - name: Verify the accepted staging image
        id: image
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          STAGING_RUN_ID: ${{ steps.staging.outputs.run_id }}
        run: |
          digest=$(node scripts/release-manifest.mjs verify \
            accepted-release.json \
            "$RELEASE_COMMIT" \
            "$STAGING_RUN_ID")
          registry_digest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:$RELEASE_COMMIT" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$registry_digest" = "$digest"
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify staging still serves this commit
        env:
          SMOKE_APP_URL: ${{ vars.STAGING_APP_URL }}
          EXPECTED_ENV: staging
          EXPECTED_RELEASE: ${{ steps.release.outputs.commit }}
          ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: sh scripts/smoke-environment.sh
      - name: Preview the reviewed production migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: |
          npx supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all \
            --skip-vault \
            --dry-run \
            > production-migration-dry-run.txt
          sed -n '1,200p' production-migration-dry-run.txt
      - name: Verify fresh production backup
        env:
          BACKUP_CHECK_URL: ${{ secrets.BACKUP_CHECK_URL }}
          BACKUP_CHECK_TOKEN: ${{ secrets.BACKUP_CHECK_TOKEN }}
        run: |
          umask 077
          backup_status=$(mktemp)
          trap 'rm -f "$backup_status"' EXIT
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $BACKUP_CHECK_TOKEN" \
            --output "$backup_status" \
            "$BACKUP_CHECK_URL"
          sh scripts/verify-backup-readiness.sh "$backup_status"
      - name: Apply backward-compatible migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --include-all --skip-vault
      - name: Deploy production Edge Functions
        env:
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_FUNCTION_DEPLOY_HOOK }}
          DEPLOY_SHA: ${{ steps.release.outputs.commit }}
        run: |
          curl --fail-with-body --silent --show-error --request POST --header "x-deploy-secret:${{ secrets.PRODUCTION_FUNCTION_DEPLOY_SECRET }}" --data "release=$DEPLOY_SHA" "$PRODUCTION_DEPLOY_HOOK"
      - name: Promote exact accepted image
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PREVIOUS_IMAGE_OUTPUT: previous-production-image.txt
        run: sh scripts/dokploy-deploy.sh
      - name: Smoke production
        env:
          SMOKE_APP_URL: ${{ vars.APP_URL }}
          EXPECTED_ENV: production
          EXPECTED_RELEASE: ${{ steps.release.outputs.commit }}
        run: sh scripts/smoke-environment.sh
      - name: Preserve rollback image reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-${{ github.ref_name }}
          path: previous-production-image.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve migration preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-preflight-${{ github.ref_name }}
          path: production-migration-dry-run.txt
          if-no-files-found: error
          retention-days: 30

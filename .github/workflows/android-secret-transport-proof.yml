name: Android protected parameter protocol supplement
on:
  push:
    branches: [codex/android-secret-transport-proof-20261120]
permissions:
  contents: read
jobs:
  protected-parameter-proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Check fixed input and protocol construction with fake values
        run: python3 .github/android-secret-proof/test_protocol.py
      - name: Prove bound parameters and retained logging with synthetic values
        run: python3 .github/android-secret-proof/run.py
      - name: Retain only credential-free protocol evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-secret-transport-proof
          path: ${{ runner.temp }}/android-secret-transport-proof.json
          retention-days: 7
          if-no-files-found: error

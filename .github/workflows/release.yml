name: Production release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      reviewed_validation: ${{ vars.BARBER_RELEASE_VALIDATION || 'off' }}
    permissions: { contents: read, pull-requests: read, actions: read }
  package:
    if: github.repository == 'malabdullah/barberplusplus'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: npm }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: frontend
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: APP_RELEASE=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify the exact release container
        run: |
          docker pull "$TEST_IMAGE"
          node scripts/test-production-image.mjs
        env:
          TEST_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.frontend.outputs.digest }}
          TEST_EXPECTED_RELEASE: ${{ github.sha }}
      - name: Scan the exact published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.frontend.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: npm ci
      - run: node ops/release/package.mjs .release-private/package
        env:
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.frontend.outputs.digest }}
      - name: Bundle the two public release files
        run: python3 ops/release/bundle.py .release-private/package ".release-private/production-release-${GITHUB_SHA}.zip"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            .release-private/package/*
            .release-private/production-release-*.zip
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: .release-private/package/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish the verified public build assets
        run: |
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            ".release-private/production-release-${GITHUB_SHA}.zip" \
            .release-private/package/release.json .release-private/package/backend.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Verified build $GITHUB_SHA" --prerelease --latest=false \
            --notes "Verified source $GITHUB_SHA from release workflow run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT. Deployment remains subject to VPS verification and initial cutover acceptance."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Full release validation comparison
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  validate:
    if: github.repository == 'malabdullah/barberplusplus' && vars.BARBER_RELEASE_MEASURE_FIRST == 'true' && vars.BARBER_RELEASE_VALIDATION == 'verified-v1'
    uses: ./.github/workflows/ci.yml
    with:
      reviewed_validation: shadow-v1

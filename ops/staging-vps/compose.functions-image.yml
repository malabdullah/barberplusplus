# Required final layer for the compiled function artifact. Never supply a tag.
# The digest must be published by the approved release build, not a local test.
services:
  functions:
    image: ${STAGING_FUNCTIONS_IMAGE:?A reviewed GHCR function-image digest is required}
    command: [start, --main-service, /home/deno/bundles/main.eszip]
    volumes: !override []
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700
    mem_limit: 768m
    cpus: 1
    pids_limit: 256

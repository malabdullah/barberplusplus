<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirm your email | Barber++</title>
  <link rel="stylesheet" href="/email/verify.css">
  <script src="/runtime-config.js" defer></script>
  <script type="module" src="/email/verify.js"></script>
</head>
<body>
  <header><a href="/" aria-label="Barber++ home"><img class="light-logo" src="/brand/barber-horizontal-light.svg" alt="Barber++"><img class="dark-logo" src="/brand/barber-horizontal-dark.svg" alt="Barber++"></a></header>
  <main>
    <p class="eyebrow">Barber++</p>
    <h1>Confirm your email</h1>
    <p id="message">Continue to securely complete your request with Barber++.</p>
    <button id="continue" type="button" hidden>Continue</button>
    <a id="back" href="/login">Back to sign in</a>
    <noscript><p>Enable JavaScript to use this link, or enter the verification code from your email on the sign-in page.</p></noscript>
  </main>
</body>
</html>
